name: Smoke test
on:
  pull_request:
  push:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint .

      - name: Template default
        run: helm template test .

      - name: Install chart
        run: helm install test . --wait --timeout 5m --create-namespace --namespace test-helm-chart --set foo=bar

      - name: Assert values dumped
        run: |
          kubectl get configmap test -n test-helm-chart -o jsonpath='{.data.values}' | grep foo

      - name: Uninstall chart
        run: helm uninstall test -n test-helm-chart --wait